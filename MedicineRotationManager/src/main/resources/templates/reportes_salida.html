<!-- report-entries.html -->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Reporte Ingresos y Salidas</title>

    <style>

        body{
            font-family: Arial;
            margin: 40px;
        }

        h1{
            color: #1d4ed8;
            text-align: center;
        }

        table{
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th{
            background: #1e40af;
            color: white;
        }

        th, td{
            border: 1px solid #d1d5db;
            padding: 12px;
            text-align: center;
        }

        .inside{
            background: #dcfce7;
            color: #166534;
            padding: 5px 10px;
            border-radius: 20px;
            font-weight: bold;
        }

        .outside{
            background: #fee2e2;
            color: #991b1b;
            padding: 5px 10px;
            border-radius: 20px;
            font-weight: bold;
        }

        .failed{
            background: #fef3c7;
            color: #92400e;
            padding: 5px 10px;
            border-radius: 20px;
            font-weight: bold;
        }

    </style>

</head>

<body>

<h1>Historial de Ingresos y Salidas</h1>

<table>

    <thead>
    <tr>
        <th>Estudiante</th>
        <th>DNI</th>
        <th>Fecha</th>
        <th>Hora</th>
        <th>Estado</th>
    </tr>
    </thead>

    <tbody>

    <tr th:each="entry : ${entries}">

        <td th:text="${entry.student.name}"></td>

        <td th:text="${entry.student.dni}"></td>

        <td th:text="${#temporals.format(entry.assistance,'yyyy-MM-dd')}"></td>

        <td th:text="${#temporals.format(entry.assistance,'HH:mm')}"></td>

        <td>

            <span
                    th:if="${entry.statusEntry.name() == 'DENTRO'}"
                    class="inside"
                    th:text="${entry.statusEntry}">
            </span>

            <span
                    th:if="${entry.statusEntry.name() == 'FUERA'}"
                    class="outside"
                    th:text="${entry.statusEntry}">
            </span>

            <span
                    th:if="${entry.statusEntry.name() == 'FALLIDO'}"
                    class="failed"
                    th:text="${entry.statusEntry}">
            </span>

        </td>

    </tr>

    </tbody>

</table>

</body>
</html>
